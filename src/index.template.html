      <div class="card-fields">${fieldsFor(s,i)}</div>
    </div>`).join('');
}
function syncCards(){
  [...cardsEl.children].forEach((c,i)=>c.classList.toggle('current', i===idx));
}

/* live edit — write field values into deck and re-render deck (debounced) */
let rerenderT;
function scheduleRerender(){
  clearTimeout(rerenderT);
  rerenderT = setTimeout(()=>{
    const keep = idx;
    renderDeck();
    enter(keep);
  }, 350);
}
cardsEl.addEventListener('input', e=>{
  const card = e.target.closest('.card'); if(!card) return;
  const s = deck.slides[+card.dataset.i];
  const f = e.target.dataset.f, ifield = e.target.dataset.if;
  if (ifield!=null){
    s.items[+e.target.dataset.item][ifield] = e.target.value;
  } else if (f){
    if (e.target.type==='checkbox') s[f]=e.target.checked;
    else if (e.target.type==='number') s[f]=parseFloat(e.target.value)||0;
    else s[f]=e.target.value;
  }
  const titleEl = card.querySelector('.title');
  if (titleEl) titleEl.textContent = slideTitle(s)||'—';
  scheduleRerender();
});
cardsEl.addEventListener('click', e=>{
  const card = e.target.closest('.card'); if(!card) return;
  const i = +card.dataset.i;
  const act = e.target.dataset.act;
  if (act){
    e.stopPropagation();
    if (act==='replay'){ enter(i); return; }
    if (act==='del'){ if(deck.slides.length>1){ deck.slides.splice(i,1); expanded=-1; } }
    if (act==='dup'){ deck.slides.splice(i+1,0,JSON.parse(JSON.stringify(deck.slides[i]))); }
    if (act==='up' && i>0){ [deck.slides[i-1],deck.slides[i]]=[deck.slides[i],deck.slides[i-1]]; }
    if (act==='down' && i<deck.slides.length-1){ [deck.slides[i+1],deck.slides[i]]=[deck.slides[i],deck.slides[i+1]]; }
    renderCards(); renderDeck(); enter(Math.min(idx, deck.slides.length-1));
    return;
  }
  if (e.target.closest('.card-top')){
    // jump the show to this slide, and expand
    expanded = (expanded===i) ? -1 : i;
    renderCards();
    enter(i);
  }
});

/* global settings */
const gDur=document.getElementById('gDur'), gFade=document.getElementById('gFade'), gLogo=document.getElementById('gLogo');
function syncGlobals(){
  gDur.value=deck.settings.duration; gFade.value=deck.settings.fade; gLogo.checked=!!deck.settings.watermark;
}
gDur.oninput = ()=>{ deck.settings.duration=parseFloat(gDur.value)||8; };
gFade.oninput = ()=>{ deck.settings.fade=parseFloat(gFade.value)||0; scheduleRerender(); };
gLogo.onchange = ()=>{ deck.settings.watermark=gLogo.checked; enter(idx); };

/* add menu */
const NEW = {
  statement:{type:'statement',duration:8,kicker:'',heading:'Your headline goes here.',line2mono:false},
  number:{type:'number',duration:8,kicker:'',prefix:'',value:100,decimals:0,suffix:'+',label:'describe the number'},
  chart:{type:'chart',duration:11,big:'10X',label:'what grew',startLabel:'1%',endLabel:'10%',points:'1,2,2.5,4,6,7,9,10'},
  stats:{type:'stats',duration:9,kicker:'',items:[{value:'1',label:'one'},{value:'2',label:'two'},{value:'3',label:'three'}]},
  logo:{type:'logo',duration:9,tagline:'Complete upload\nand delivery platform',sub:''},
  logoAnim:{type:'logoAnim',duration:10,variant:'assemble',tagline:'uploadcare.com',tagmono:true},
  board:{type:'board',duration:11,layout:'hero',title:'Complete upload\nand delivery platform',foot:'© 2011–2026 UPLOADCARE INC.',globe:true,float:true,typing:true,typeSpeed:16},
  reveal:{type:'reveal',duration:8,kicker:'',line:'Every image starts with an upload.',reveal:true,textFx:'stagger'},
  mockup:{type:'mockup',duration:8,kicker:'',heading:'Everyone can build a file uploader.',kind:'uploader'},
  code:{type:'code',duration:10,kicker:'',line:'Ask your coding\nagent about us.',cmd:'uploadcare file upload my-image.jpg',lines:'Uploading my-image.jpg\u2026\n\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588  100%\n\u2713 https://ucarecdn.com/\u2026/my-image.jpg\nDone in 0.4s.',typeSpeed:18,textFx:'weight'},
  upload:{type:'upload',duration:12,kicker:'',heading:'As simple as drag and drop.',heading2:'Then it becomes a side project that never ends.',outcome:true,progressMs:3000,textFx:'weight'},
  chaos:{type:'chaos',duration:12,kicker:'',heading:'Then it becomes\na side project\nthat never ends.',textFx:'stagger'},
  install:{type:'install',duration:9,heading:'Already in your\nWebflow Marketplace.',foot:'A native, no-code File Uploader app. Approved by Webflow.',textFx:'weight'}
};
const addBtn=document.getElementById('addBtn'), addList=document.getElementById('addlist');
addBtn.onclick=()=>addList.classList.toggle('open');
addList.onclick=e=>{
  const t=e.target.dataset.type; if(!t) return;
  deck.slides.push(JSON.parse(JSON.stringify(NEW[t])));
  addList.classList.remove('open');
  expanded=deck.slides.length-1;
  renderCards(); renderDeck(); enter(deck.slides.length-1);
  cardsEl.lastElementChild.scrollIntoView({behavior:'smooth'});
};

/* editor open/close */
const gear=document.getElementById('gear');
function openEditor(){ editor.classList.add('open'); renderCards(); syncGlobals(); }
function closeEditor(){ editor.classList.remove('open'); addList.classList.remove('open'); }
gear.onclick=openEditor;
document.getElementById('edClose').onclick=closeEditor;

/* export / import */
const io=document.getElementById('io'), ioText=document.getElementById('ioText');
document.getElementById('ioBtn').onclick=()=>{ ioText.value=JSON.stringify(deck,null,2); io.classList.add('open'); };
document.getElementById('ioClose').onclick=()=>io.classList.remove('open');
document.getElementById('ioApply').onclick=()=>{
  try{
    const d=JSON.parse(ioText.value);
    if(!d.slides||!d.settings) throw new Error('missing slides/settings');
    deck=d; io.classList.remove('open');
    renderDeck(); renderCards(); syncGlobals(); enter(0);
  }catch(err){ alert('Invalid JSON: '+err.message); }
};
document.getElementById('ioDownload').onclick=()=>{
  const blob=new Blob([JSON.stringify(deck,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='uploadcare-deck.json'; a.click();
  URL.revokeObjectURL(a.href);
};

/* fullscreen */
function toggleFS(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
}
document.getElementById('fsBtn').onclick=toggleFS;

/* keyboard */
addEventListener('keydown', e=>{
  if (e.target.matches('input,textarea,select')) return;
  if (e.key==='ArrowRight'){ enter(idx+1); }
  if (e.key==='ArrowLeft'){ enter(idx-1); }
  if (e.key===' '){ e.preventDefault(); togglePlay(); }
  if (e.key==='f'||e.key==='F'){ toggleFS(); }
  if (e.key==='e'||e.key==='E'){ editor.classList.contains('open')?closeEditor():openEditor(); }
  if (e.key==='g'||e.key==='G'){ gridOverlay.classList.toggle('show'); }
  if (e.key==='Escape'){ closeEditor(); io.classList.remove('open'); }
});

/* auto-hide chrome + cursor when idle (kiosk friendly) */
let idleT;
function wake(){
  document.body.classList.add('ui-awake');
  document.body.style.cursor='';
  clearTimeout(idleT);
  idleT=setTimeout(()=>{
    document.body.classList.remove('ui-awake');
    if (!editor.classList.contains('open')) document.body.style.cursor='none';
  }, 3500);
}
addEventListener('mousemove', wake);
addEventListener('touchstart', wake);
wake();

/* boot */
renderDeck();
enter(0);
</script>
</body>
</html>
