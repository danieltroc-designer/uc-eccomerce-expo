<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uploadcare — Show</title>
<style>
/*__COMMIT_MONO__*/
/*__INTER_VAR__*/
/*__JB_MONO__*/

  :root{
    --bg:#090909;
    --ink:#F2F2F0;
    --ink-dim:#B9B9C6;      /* lavender-tinted secondary, like the keynote slides */
    --ink-faint:#57575E;
    --brand:#FFCF3E;
    --ok:#3DDC84;
    --panel:#111113;
    --panel-2:#18181B;
    --line:#232328;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --cmono:'Commit Mono', 'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;

    /* ---- Swiss grid (invisible layout scaffold on the 1920x1080 stage) ----
       Every slide is authored against this: a 75px margin all round and a 4x4
       module grid. The grid itself never renders (toggle with "g" for design
       checks); it exists so headlines, cards and the glyph share one rhythm. */
    --gm:75px;                                   /* margin (also col/row 1 start) */
    --gcol:calc((1920px - 2*var(--gm)) / 4);     /* 442.5px column module */
    --grow:calc((1080px - 2*var(--gm)) / 4);     /* 232.5px row module */
    --g2:calc(var(--gcol) * 2);                  /* 2-column span for headlines */

    /* ---- motion scale (one place to tune the whole deck's feel) ----
       Easings mirror Apple's guidance: a snappy expo "out" for entrances, a
       symmetric in-out for reversible/travel moves, and a subtle overshoot
       "pop" reserved for momentum landings. Durations are a 4-step scale.
       The JS spring sampler (see MOTION in the script) reuses the same
       response/bounce vocabulary for the cursor demos. */
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-in-out:cubic-bezier(.4,0,.2,1);
    --ease-pop:cubic-bezier(.34,1.45,.64,1);
    --dur-1:.30s;                                 /* micro (chrome, taps)     */
    --dur-2:.42s;                                 /* standard element entrance*/
    --dur-3:.58s;                                 /* headline rise / travel   */
    --dur-4:.72s;                                 /* large / clip reveals     */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 16:9 stage, letterboxed & scaled ---------- */
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
  #stage{
    width:1920px;height:1080px;
    position:relative;flex:none;
    transform-origin:center center;
    overflow:hidden;
  }

  /* ---------- slides ---------- */
  .slide{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;
    transition:opacity var(--fade,520ms) var(--ease-out);
  }
  .slide.active{opacity:1;visibility:visible}

  /* invisible Swiss-grid scaffold — hidden by default, toggle with "g" */
  #gridOverlay{position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .12s ease}
  #gridOverlay.show{opacity:1}
  #gridOverlay .gi{
    position:absolute;left:var(--gm);right:var(--gm);top:var(--gm);bottom:var(--gm);
    display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
  }
  #gridOverlay .gi > i{border:1px solid rgba(255,45,60,.55);margin:-.5px 0 0 -.5px}

  /* Uploadcare glyph — a fixed brand mark anchored to the bottom-right grid
     corner, present on every slide for a consistent signature. */
  .watermark{
    position:absolute;right:56px;bottom:50px;width:34px;height:auto;z-index:35;
    opacity:0;transition:opacity 600ms ease;pointer-events:none;
  }
  .watermark svg{width:100%;height:auto;display:block}
  .watermark.show{opacity:1}

  /* progress hairline */
  #progress{
    position:absolute;left:0;bottom:0;height:3px;width:100%;
    background:rgba(255,255,255,.06);z-index:6;
  }
  #progress i{
    display:block;height:100%;width:0;
    background:rgba(255,255,255,.28);
  }

  /* ---- shared type ---- */
  .kicker{
    font-family:var(--mono);font-size:22px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--ink-faint);
    margin-bottom:44px;
  }
  /* modern reveal: a short rise + fade with a snappy expo-out ease. Motion is
     transform-driven (no slow blur/opacity crossfades) and settles fast. */
  .reveal{opacity:0;transform:translateY(16px);transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out)}
  .slide.active .reveal{opacity:1;transform:none}
  .reveal.d1{--grp:60ms}
  .reveal.d2{--grp:160ms}
  .reveal.d3{--grp:260ms}
  .reveal.d4{--grp:360ms}
  .slide.active .reveal.d1{transition-delay:.06s}
  .slide.active .reveal.d2{transition-delay:.16s}
  .slide.active .reveal.d3{transition-delay:.26s}
  .slide.active .reveal.d4{transition-delay:.36s}

  /* ---- shared text animation presets — same "Text animation" control on
     every slide type (see fieldsFor). "rise" (above) is the default/off
     state; these layer on top of it via an extra fx-* class. ---- */
  .reveal.fx-blur{
    filter:blur(9px);
    transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out),filter .5s var(--ease-out);
  }
  .slide.active .reveal.fx-blur{filter:blur(0)}

  .reveal.fx-weight{
    font-weight:200;
    transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out),font-weight .62s var(--ease-out);
  }
  .slide.active .reveal.fx-weight{font-weight:var(--fw-target,600)}

  .reveal.fx-stagger{opacity:1!important;transform:none!important;transition:none!important}
  .reveal.fx-stagger .w{
    display:inline-block;opacity:0;transform:translateY(.42em);
    transition:opacity .38s ease,transform .5s var(--ease-out);
    transition-delay:calc(var(--grp,0ms) + var(--wi,0)*32ms);
  }
  .slide.active .reveal.fx-stagger .w{opacity:1;transform:none}

  /* mask reveal: the line's text slides up from behind a hard edge (the
     element clips its own overflow) — the modern "editorial" entrance.
     padding/negative-margin gives ascenders & descenders room so the text
     box isn't clipped at rest, without shifting layout. */
  .reveal.fx-clip{opacity:1!important;transform:none!important;transition:none!important;overflow:hidden;padding-block:.09em;margin-block:-.09em}
  .reveal.fx-clip .cl{
    display:inline-block;transform:translateY(115%);
    transition:transform var(--dur-4) var(--ease-out);
    transition-delay:var(--grp,0ms);
  }
  .slide.active .reveal.fx-clip .cl{transform:none}

  /* ---- statement slide ---- */
  .st-wrap{text-align:center;max-width:1560px;padding:0 var(--gm)}
  .st-line1{
    font-size:104px;font-weight:600;letter-spacing:-0.025em;line-height:1.12;
    color:var(--ink-dim);
  }
  .st-line2{
    font-size:104px;font-weight:600;letter-spacing:-0.025em;line-height:1.18;
    color:var(--ink);margin-top:10px;
  }
  .st-line2.mono{
    font-family:var(--mono);font-weight:500;font-size:92px;letter-spacing:-0.01em;
  }

  /* ---- pipeline chips (Upload -> Store -> Transform -> Deliver) ---- */
  .pl-row{display:flex;align-items:center;justify-content:center;margin-top:64px}
  .pl-pill{
    font-family:var(--mono);font-size:22px;letter-spacing:.04em;color:var(--ink-dim);
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px 28px;
  }
  .pl-line{width:64px;height:8px;margin:0 2px;display:flex;align-items:center;flex:none}
  .pl-line i{width:8px;height:8px;background:var(--ink-faint);border-radius:2px;flex:none}
  .pl-line span{flex:1;height:1px;background:var(--line)}
  /* the row itself appears instantly; each pill/connector cascades in on
     its own, and each connector's line "draws" left-to-right right after */
  .pl-row.pl-anim{opacity:1!important;transform:none!important;transition:none!important}
  .pl-row.pl-anim .pl-pill,.pl-row.pl-anim .pl-line{
    opacity:0;transform:translateY(12px);
    transition:opacity .38s ease,transform .48s var(--ease-out);
    transition-delay:calc(var(--grp,0ms) + var(--pi,0)*90ms);
  }
  .slide.active .pl-row.pl-anim .pl-pill,.slide.active .pl-row.pl-anim .pl-line{opacity:1;transform:none}
  .pl-row.pl-anim .pl-line span{transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease-out);transition-delay:calc(var(--grp,0ms) + var(--pi,0)*90ms + .14s)}
  .slide.active .pl-row.pl-anim .pl-line span{transform:scaleX(1)}

  /* mono subtitle under the platform headline; text after "|" glows */
  .st-sub{
    font-family:var(--mono);font-size:26px;letter-spacing:.02em;color:var(--ink-dim);
    margin-top:22px;
  }
  .st-sub-hi{color:var(--brand)}

  /* shining pipeline — a brand-yellow highlight sweeps the chips once they've
     settled, then the row keeps a soft glow (slide 6). */
  .pl-shine .pl-pill{position:relative;overflow:hidden}
  .slide.active .pl-shine .pl-pill{
    border-color:rgba(255,207,62,.35);
    box-shadow:0 0 0 1px rgba(255,207,62,.06),0 8px 30px rgba(255,207,62,.05);
    transition:border-color .6s ease,box-shadow .6s ease;transition-delay:1s;
  }
  .pl-shine .pl-pill::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,207,62,.45) 50%,transparent 65%);
    transform:translateX(-160%);
  }
  .slide.active .pl-shine .pl-pill::after{
    animation:plShine 2.6s cubic-bezier(.16,1,.3,1) 1.1s infinite;
  }
  @keyframes plShine{0%{transform:translateX(-160%)}55%,100%{transform:translateX(160%)}}

  /* ---- chaos slide: the endless, self-tangling feature graph ----
     a "File uploaded" node lands first, then the whole maintenance web blooms
     in around it. The headline rides on top behind a soft left scrim. */
  .ch2-wrap{position:absolute;inset:0;overflow:hidden}
  .ch2-lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;
    opacity:0;transition:opacity 1.3s ease;transition-delay:.6s}
  .slide.active .ch2-lines{opacity:1}
  .ch2-lines path{fill:none;stroke:#34343c;stroke-width:1.1}
  .ch2-lines circle{fill:#45454e}
  .ch2-node{
    position:absolute;transform:translate(-50%,-50%) scale(.88);
    font-family:var(--mono);font-size:15px;letter-spacing:.05em;color:#6d6d77;white-space:nowrap;
    border:1px solid #26262c;background:rgba(15,15,18,.72);border-radius:8px;padding:7px 13px;z-index:2;
    opacity:0;transition:opacity .5s ease,transform .6s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0ms);
  }
  .slide.active .ch2-node{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .ch2-node.em{color:var(--ink);border-color:#54545c;background:rgba(24,24,28,.94);font-size:16px;z-index:3}
  .ch2-node.up{border-color:rgba(255,207,62,.55);color:#fff;background:rgba(28,26,18,.95)}
  .slide.active .ch2-node.up{box-shadow:0 0 0 1px rgba(255,207,62,.22),0 12px 44px rgba(255,207,62,.10)}
  .ch2-scrim{position:absolute;inset:0;z-index:4;pointer-events:none;
    background:linear-gradient(90deg,rgba(9,9,9,.97) 0%,rgba(9,9,9,.84) 27%,rgba(9,9,9,0) 52%)}
  .ch2-left{position:absolute;left:var(--gm);top:50%;transform:translateY(-50%);z-index:5;max-width:var(--g2)}

  /* ---- number slide ---- */
  .num-wrap{text-align:center;padding:0 var(--gm)}
  .num-big{
    font-size:340px;font-weight:700;letter-spacing:-0.04em;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .num-big .suffix{font-weight:700}
  .num-label{
    font-size:52px;font-weight:500;color:var(--ink-dim);
    margin-top:36px;letter-spacing:-0.01em;
  }

  /* ---- chart slide ---- */
  .ch-wrap{position:absolute;inset:0}
  .ch-head{position:absolute;top:170px;left:var(--gm);max-width:760px}
  .ch-big{font-size:300px;font-weight:700;letter-spacing:-0.04em;line-height:.95}
  .ch-label{font-size:46px;font-weight:500;color:var(--ink-dim);margin-top:28px;letter-spacing:-0.01em}
  .ch-svg{position:absolute;inset:0;width:100%;height:100%}
  .ch-line{fill:none;stroke:#DADAE6;stroke-width:6;stroke-linecap:square;stroke-linejoin:round}
  .ch-dot{fill:#fff}
  .ch-val{font-family:var(--mono);font-size:34px;fill:#EDEDF5}
  .ch-line,.ch-dot,.ch-val{opacity:0}
  .slide.active .ch-line{opacity:1}
  .ch-quote{
    position:absolute;left:var(--gm);bottom:110px;max-width:760px;
    font-size:32px;font-weight:500;color:var(--ink-dim);line-height:1.4;
  }
  .ch-quote span{display:block;margin-top:14px;font-family:var(--mono);font-size:20px;color:var(--ink-faint);letter-spacing:.04em}

  /* ---- stats trio ---- */
  .tr-wrap{display:flex;gap:130px;align-items:flex-start;padding:0 var(--gm)}
  .tr-item{text-align:left}
  .tr-val{font-size:128px;font-weight:700;letter-spacing:-0.035em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tr-lab{font-size:34px;color:var(--ink-dim);margin-top:24px;font-weight:500}
  .tr-rule{width:64px;height:4px;background:var(--brand);margin-bottom:36px}
  .tr-kicker{text-align:center;margin-bottom:90px}
  /* customer quote sitting under the metrics */
  .tr-quote{max-width:1180px;margin:96px auto 0;text-align:center}
  .tr-quote-line{font-size:46px;font-weight:600;letter-spacing:-0.02em;line-height:1.28;color:var(--ink)}
  .tr-quote-by{margin-top:30px;font-family:var(--mono);font-size:20px;letter-spacing:.02em;color:var(--ink-dim)}
  .tr-quote-by b{color:var(--ink);font-weight:500}

  /* ---- animated logo slide ---- */
  .la-wrap{text-align:center;padding:0 var(--gm)}
  .la-logo{display:flex;justify-content:center}
  .la-logo svg{height:170px;width:auto;overflow:visible}
  .la-logo.mark svg{height:430px}
  .la-logo svg path{transform-box:fill-box;transform-origin:center}
  .la-tag{
    font-size:44px;font-weight:500;color:var(--ink-dim);
    margin-top:80px;letter-spacing:-0.01em;opacity:0;
  }
  .la-tag.mono{font-family:var(--mono);font-size:30px;color:var(--ink-faint);letter-spacing:.08em}

  /* ---- logo slide ---- */
  .lg-wrap{position:absolute;inset:0;display:flex;align-items:center}
  .lg-left{padding-left:var(--gm);z-index:2;max-width:900px}
  .lg-logo svg{height:96px;width:auto;display:block}
  .lg-tag{
    font-size:76px;font-weight:600;letter-spacing:-0.02em;line-height:1.22;
    margin-top:70px;color:var(--ink);
  }
  .lg-sub{
    font-family:var(--mono);font-size:26px;color:var(--ink-faint);
    margin-top:56px;letter-spacing:.06em;
  }
  .lg-canvas{position:absolute;right:0;top:0;height:100%;width:52%;}

  /* ---- reveal slide (mosaic -> photo) ---- */
  .rv-wrap{position:absolute;inset:0;display:flex;align-items:center}
  .rv-left{padding-left:var(--gm);z-index:2;max-width:var(--g2)}
  .rv-line{
    font-size:92px;font-weight:600;letter-spacing:-0.02em;line-height:1.2;
    color:var(--ink);max-width:760px;
  }
  /* photo card — a portrait plate parked on the right, its vertical centre locked
     to the stage middle so it lines up with the headline (sits inside the grid;
     the dark gap on its right holds the brand glyph). */
  .rv-visual{position:absolute;left:1096px;top:50%;transform:translateY(-50%);width:688px;height:848px;overflow:hidden;border-radius:4px}
  .rv-visual canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
  /* the photo sits UNDER the halftone canvas; JS adds .shown right as the dots
     dissolve, so the pixels appear to resolve straight into the real image. */
  .rv-photo{position:absolute;inset:0;opacity:0;overflow:hidden;transition:opacity .7s ease;z-index:1}
  .rv-photo.shown{opacity:1}
  .rv-photo img{
    display:block;width:100%;height:100%;object-fit:cover;
    transform:scale(1.06);transition:transform 1.1s cubic-bezier(.16,1,.3,1);
  }
  .rv-photo.shown img{transform:scale(1)}
  /* a single soft diagonal sheen sweeps across once the photo settles in */
  .rv-photo::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.32) 50%,transparent 65%);
    transform:translateX(-120%);transition:transform .85s ease;transition-delay:.35s;
  }
  .rv-photo.shown::after{transform:translateX(120%)}

  /* ---- mockup slide (fake UI card) ---- */
  .mk-wrap{position:absolute;inset:0;display:flex;align-items:center}
  .mk-left{padding-left:var(--gm);z-index:2;max-width:var(--g2)}
  .mk-line1{font-size:88px;font-weight:600;letter-spacing:-0.02em;line-height:1.18;color:var(--ink-dim)}
  .mk-line2{font-size:88px;font-weight:600;letter-spacing:-0.02em;line-height:1.18;color:var(--ink);margin-top:6px}
  .mk-visual{position:absolute;right:150px;top:50%;transform:translateY(-50%);width:520px}
  .mk-overlay{
    position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);
    opacity:0;transform:scale(.94);pointer-events:none;z-index:1;
    transition:opacity .6s ease,transform .8s cubic-bezier(.16,1,.3,1);transition-delay:.2s;
  }
  .slide.active .mk-overlay{opacity:.35;transform:scale(1)}
  .mk-overlay line{stroke:var(--ink-faint);stroke-width:1.5}
  .mk-overlay circle{fill:var(--brand);opacity:.55}
  .mk-card{
    background:#EDEDF2;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative;z-index:2;
    opacity:0;transform:scale(.92) rotate(-1deg);
    transition:opacity .45s ease,transform .62s cubic-bezier(.34,1.3,.5,1);transition-delay:.1s;
  }
  .slide.active .mk-card{opacity:1;transform:none}
  .mk-modal{padding:36px}
  .mk-modal-title{font-size:22px;font-weight:600;color:#16161a;margin-bottom:20px}
  .mk-dropzone{border:2px dashed #C7C7D1;border-radius:12px;padding:44px 16px;text-align:center;color:#6a6a76;font-size:15px}
  .mk-dropzone span{color:#2E6BFF;font-weight:600}
  .mk-btn{margin-top:20px;background:#2E6BFF;color:#fff;text-align:center;padding:12px;border-radius:10px;font-weight:600;font-size:15px}
  .mk-row{display:flex;align-items:center;gap:18px;padding:22px 26px}
  .mk-icon{width:44px;height:44px;flex:none;border-radius:10px;background:var(--brand)}
  .mk-row-text{flex:1}
  .mk-row-title{font-size:18px;font-weight:600;color:#16161a}
  .mk-row-sub{font-size:14px;color:#6a6a76;margin-top:2px}
  .mk-connect{background:#2E6BFF;color:#fff;font-size:14px;font-weight:600;padding:9px 18px;border-radius:8px;flex:none}

  /* ---- upload demo slide (real uploader SVGs + cursor drag + progress) ---- */
  /* the slide plays in two acts: phase1 = "drag & drop" headline + the live
     uploader; when the progress bar completes it cross-fades to phase2 =
     the "side project that never ends" line + a File-uploaded tag, and 2s
     later the maintenance-nodes network blooms in behind everything. */
  .up-wrap{position:absolute;inset:0}
  .up-nodes{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;z-index:0;pointer-events:none}
  /* phase 1 — headline on the left, live uploader on the right */
  .up-phase1{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:40px;padding:0 var(--gm);z-index:2}
  .up-left{text-align:left;max-width:var(--g2);flex:none}
  .up-line1{font-size:88px;font-weight:600;letter-spacing:-0.02em;line-height:1.18;color:var(--ink-dim)}
  .up-line2{font-size:88px;font-weight:600;letter-spacing:-0.02em;line-height:1.18;color:var(--ink);margin-top:6px}
  /* the demo box is authored at a fixed 600×520 px inside the 1920 stage;
     the stage transform handles TV scaling, so px here == px on screen.
     position:relative keeps it a positioning context for the absolutely
     placed states/cursor/progress while it sits centered in the flex flow. */
  .up-stage{position:relative;width:600px;height:520px}
  .up-base{position:absolute;left:0;top:0;width:100%;display:block}
  .up-hover,.up-uploading{opacity:0}
  /* progress overlay sits exactly over the uploading SVG's built-in bar and
     covers it (dropzone is #fff) so we can animate a clean fill 0→100% */
  .up-progress{
    position:absolute;left:245px;top:127px;width:112px;height:18px;
    background:#fff;display:flex;align-items:center;justify-content:center;opacity:0;
  }
  .up-progress .trk{position:relative;width:96px;height:6px;background:#E2E2E4;border-radius:3px;overflow:hidden}
  .up-progress .trk i{position:absolute;left:0;top:0;height:100%;width:0;background:#141414;border-radius:3px}
  .up-hand{position:absolute;left:0;top:0;will-change:transform}
  .up-drag{position:absolute;left:0;top:0;width:96px;border-radius:10px;overflow:hidden;box-shadow:0 16px 34px rgba(0,0,0,.4)}
  .up-drag img{display:block;width:100%;height:auto}
  .up-cursor{position:absolute;left:58px;top:44px;width:38px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}

  /* phase 2 — the "side project" payoff, layered above the nodes network.
     the radial scrim keeps the copy legible over the busy graph behind it. */
  .up-phase2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;z-index:3;opacity:0}
  .up-phase2::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1600px;height:920px;background:radial-gradient(ellipse at center,rgba(9,9,9,.92) 0%,rgba(9,9,9,.78) 42%,rgba(9,9,9,0) 74%);z-index:-1;pointer-events:none}
  .up-after{text-align:center;max-width:1320px}
  .up-after-line1{font-size:88px;font-weight:600;letter-spacing:-0.02em;line-height:1.18;color:var(--ink-dim)}
  .up-after-line2{font-size:88px;font-weight:600;letter-spacing:-0.02em;line-height:1.18;color:var(--ink);margin-top:6px}
  .up-tag{width:210px;height:auto;display:block}

  /* ---- code / terminal slide (headline left, live terminal right) ---- */
  .cd-wrap{position:absolute;inset:0;display:flex;align-items:center}
  .cd-left{padding-left:var(--gm);max-width:var(--g2);z-index:2}
  .cd-window{
    position:absolute;right:75px;top:50%;transform:translateY(-50%);
    width:960px;height:468px;background:#0d0d0f;border:1px solid var(--line);border-radius:16px;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);text-align:left;
    display:flex;flex-direction:column;
  }
  .cd-window.reveal{filter:brightness(.6);transition:opacity .5s ease,transform .62s cubic-bezier(.16,1,.3,1),filter .55s ease}
  .slide.active .cd-window.reveal{filter:brightness(1);transform:translateY(-50%)}
  .cd-chrome{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);background:#141416;flex:none}
  .cd-chrome i{width:12px;height:12px;border-radius:50%;background:#33333a;flex:none;opacity:0;transition:opacity .3s ease}
  .slide.active .cd-chrome i{opacity:1}
  .slide.active .cd-chrome i:nth-child(1){background:#ff5f57;transition-delay:.42s}
  .slide.active .cd-chrome i:nth-child(2){background:#febc2e;transition-delay:.5s}
  .slide.active .cd-chrome i:nth-child(3){background:#28c840;transition-delay:.58s}
  .cd-file{margin-left:10px;font-family:var(--cmono);font-size:14px;color:#7a7a82}
  .cd-body{padding:24px 28px;flex:1;font-family:var(--cmono);font-size:20px;line-height:1.7;color:#8E8E8E;overflow:hidden}
  .cd-cmd{color:#c9c9d2}
  .cd-cmd b{color:#6a6a72;font-weight:400;margin-right:8px}
  .cd-out{margin-top:14px;color:#8E8E8E;white-space:pre-wrap}
  .cd-out .g{color:var(--ok)}
  /* run bar pinned to the terminal's lower-left; the cursor taps RUN */
  .cd-runbar{position:absolute;left:28px;bottom:26px;display:flex;align-items:center;gap:16px;z-index:3}
  .cd-run{
    font-family:var(--cmono);font-size:14px;letter-spacing:.12em;color:#d6d6de;
    background:#232329;border:1px solid #34343c;border-radius:8px;padding:9px 20px;
  }
  .cd-run.press{background:#2E6BFF;border-color:#2E6BFF;color:#fff}
  .cd-mascot{width:40px;height:auto;display:block;image-rendering:pixelated}
  .cd-cursor{position:absolute;left:0;top:0;width:34px;z-index:4;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));opacity:0;will-change:transform}

  /* ---- Webflow marketplace install slide ---- */
  .in-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--gm)}
  .in-head{margin-bottom:66px}
  .in-app{display:flex;flex-direction:column;align-items:center}
  .in-card{display:flex;align-items:flex-start;gap:18px;text-align:left;width:520px}
  .in-icon{width:56px;height:56px;border-radius:12px;background:#141416;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex:none}
  .in-icon svg{width:34px;height:34px}
  .in-icon svg path{fill:var(--brand)}
  .in-title{font-size:17px;font-weight:600;color:var(--ink)}
  .in-dl{font-family:var(--mono);font-size:13px;color:#7a7a82;margin:3px 0 9px}
  .in-desc{font-size:14px;color:#8a8a92;line-height:1.5;max-width:420px}
  .in-btnrow{position:relative;align-self:flex-start;margin-left:74px;margin-top:20px}
  .in-btn{background:#2E6BFF;color:#fff;font-size:15px;font-weight:600;padding:11px 24px;border-radius:9px;
    display:inline-block;transition:transform .12s ease,filter .12s ease}
  .in-btn.press{transform:scale(.95);filter:brightness(.88)}
  .in-btn.done{background:#1f8f4e}
  .in-cursor{position:absolute;left:0;top:0;width:34px;z-index:4;opacity:0;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));will-change:transform}
  .in-foot{margin-top:60px;font-family:var(--mono);font-size:20px;letter-spacing:.01em;color:#7a7a82}

  /* ================= HERO BOARD SLIDE ================= */
  .hb{position:absolute;inset:0;overflow:hidden}
  .hb-logo{position:absolute;top:76px;left:90px;height:56px}
  .hb-logo svg{height:100%;width:auto}
  .hb-title{
    position:absolute;top:70px;right:96px;text-align:left;
    font-family:var(--sans);font-weight:700;font-size:86px;line-height:1.04;
    letter-spacing:-0.03em;color:var(--ink);max-width:1040px;
  }
  .hb-foot{
    position:absolute;left:0;right:0;bottom:56px;text-align:center;
    font-family:var(--cmono);font-size:22px;letter-spacing:.14em;color:#595959;
  }
  .hb-globe{
    position:absolute;left:50%;top:52%;width:1560px;
    transform:translate(-50%,-50%);pointer-events:none;
    opacity:0;transition:opacity .8s ease;
  }
  .slide.active .hb-globe{opacity:1}
  .hb-globe svg{width:100%;height:auto;display:block}
  .hb-globe.spin{animation:hbGlobe 68s ease-in-out infinite}
  @keyframes hbGlobe{
    0%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-51%) scale(1.025)}
    100%{transform:translate(-50%,-50%) scale(1)}
  }

  /* scattered signal dots */
  .hb-dot{position:absolute;width:9px;height:9px;border-radius:1px}
  .hb-dot.g{background:var(--ok)}
  .hb-dot.y{background:var(--brand)}
  .hb-dot.d{background:#4a4a30}
  .hb-dot.pulse{animation:hbDot 3.4s ease-in-out infinite}
  @keyframes hbDot{0%,100%{opacity:.35}50%{opacity:1}}

  /* floating file card + its terminal annotation */
  .hb-node{position:absolute;opacity:0}
  .slide.active .hb-node{animation:hbIn .6s cubic-bezier(.16,1,.3,1) forwards}
  .slide.active .hb-node.n1{animation-delay:.14s}
  .slide.active .hb-node.n2{animation-delay:.3s}
  .slide.active .hb-node.n3{animation-delay:.46s}
  .slide.active .hb-node.n4{animation-delay:.62s}
  @keyframes hbIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

  /* perpetual gentle drift on an inner wrapper (composes with entrance) */
  .hb-inner{position:relative}
  .hb-node.float .hb-inner{animation-duration:var(--fdur,9s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-delay:var(--fdelay,0s)}
  .hb-node.float.n1 .hb-inner{animation-name:hbF1}
  .hb-node.float.n2 .hb-inner{animation-name:hbF2}
  .hb-node.float.n3 .hb-inner{animation-name:hbF3}
  .hb-node.float.n4 .hb-inner{animation-name:hbF4}
  @keyframes hbF1{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(6px,-13px) rotate(.5deg)}}
  @keyframes hbF2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-7px,-10px) rotate(-.5deg)}}
  @keyframes hbF3{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(5px,11px) rotate(.4deg)}}
  @keyframes hbF4{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-5px,9px) rotate(-.4deg)}}

  .hb-card{
    border-radius:22px;overflow:hidden;position:relative;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .hb-card img{display:block;width:100%;height:100%;object-fit:cover}
  .hb-card.framed{
    border:1.5px solid #2b2b30;background:#0d0d0f;padding:10px;border-radius:20px;
    box-shadow:none;
  }
  .hb-card.framed img{border-radius:12px}
  .hb-card.docx{background:transparent;box-shadow:none}

  .hb-meta{
    position:absolute;font-family:var(--cmono);font-size:18px;line-height:1.7;
    letter-spacing:.01em;color:#8E8E8E;
  }
  .hb-line{min-height:1.7em;white-space:pre}
  .hb-meta b{color:#8E8E8E;font-weight:500}
  .hb-meta .g{color:var(--ok);font-weight:500}
  .hb-meta .dim{color:#595959}
  .hb-cursor{
    display:inline-block;width:9px;height:19px;background:var(--ok);
    vertical-align:-3px;margin-left:1px;animation:hbBlink 1.05s steps(1) infinite;
  }
  @keyframes hbBlink{50%{opacity:0}}

  /* the little status LED beside the framed JPEG */
  .hb-led{position:absolute;width:11px;height:11px;background:var(--ok);border-radius:2px}

  /* board slide, outro layout: centered CTA instead of top-right title,
     terminal readouts hidden so the cards are purely decorative */
  .hb-outro-mode .hb-meta,.hb-outro-mode .hb-led{display:none}
  .hb-outro{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);
    text-align:center;z-index:2;max-width:1200px;
  }
  .hb-outro-line{
    font-family:var(--sans);font-weight:700;font-size:88px;line-height:1.14;
    letter-spacing:-0.03em;color:var(--ink);
  }
  .hb-outro-sub{font-size:40px;font-weight:500;color:var(--ink-dim);margin-top:28px}

  /* ---- shared heading type (from Figma spec) — one place to tweak every
     slide's headline. Placed after the individual heading rules so it wins
     the shared props while their per-class color/margins stay intact.
     Inter 580 · 88px · line-height 106.5% · letter-spacing -1.5% ---- */
  :root{ --h-size:72px; --h-weight:580; --h-lh:1.065; --h-ls:-.015em; }
  /* .hd is the single, naturally-wrapping headline used by statement / mockup /
     upload. code, reveal and the board titles share the same type spec. */
  .hd,.cd-line,.rv-line,.hb-title,.hb-outro-line{
    font-family:var(--sans);
    font-weight:var(--h-weight);
    font-size:var(--h-size);
    line-height:var(--h-lh);
    letter-spacing:var(--h-ls);
  }
  .hd{color:var(--ink)}
  .hd.mono{ font-family:var(--mono);font-weight:500 }

  /* ================= EDITOR ================= */
  #gear{
    position:fixed;right:20px;bottom:20px;z-index:50;
    width:44px;height:44px;border-radius:10px;border:1px solid var(--line);
    background:rgba(17,17,19,.85);color:#9a9aa2;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:19px;
    opacity:0;transition:opacity .3s;
  }
  body.ui-awake #gear{opacity:1}
  #gear:hover{color:#fff}

  #hint{
    position:fixed;left:20px;bottom:20px;z-index:50;
    font-family:var(--mono);font-size:12px;color:#6a6a72;
    background:rgba(17,17,19,.85);border:1px solid var(--line);
    padding:8px 12px;border-radius:8px;
    opacity:0;transition:opacity .3s;pointer-events:none;
  }
  body.ui-awake #hint{opacity:1}

  #editor{
    position:fixed;top:0;right:0;height:100%;width:480px;z-index:60;
    background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .35s cubic-bezier(.22,.61,.36,1);
    display:flex;flex-direction:column;font-size:14px;
  }
  #editor.open{transform:none}
  .ed-head{
    padding:20px 24px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;flex:none;
  }
  .ed-head h2{font-size:15px;font-weight:600;letter-spacing:.02em}
  .ed-head .x{background:none;border:0;color:#8a8a92;font-size:20px;cursor:pointer}
  .ed-body{flex:1;overflow-y:auto;padding:18px 24px 120px}
  .ed-body::-webkit-scrollbar{width:8px}
  .ed-body::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:4px}

  .ed-global{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:22px;background:var(--panel-2)}
  .ed-global h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#7a7a82;margin-bottom:14px}

  .card{
    border:1px solid var(--line);border-radius:12px;background:var(--panel-2);
    margin-bottom:14px;overflow:hidden;
  }
  .card.current{border-color:#3d3d46}
  .card-top{
    display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;
  }
  .card-top .type{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--brand);background:rgba(255,207,62,.08);
    padding:4px 8px;border-radius:6px;flex:none;
  }
  .card-top .title{flex:1;color:#cfcfd6;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-top .mini{
    background:none;border:1px solid var(--line);color:#8a8a92;border-radius:6px;
    width:26px;height:26px;cursor:pointer;font-size:13px;line-height:1;flex:none;
  }
  .card-top .mini:hover{color:#fff;border-color:#3d3d46}
  .card-fields{padding:4px 14px 16px;border-top:1px solid var(--line);display:none}
  .card.expanded .card-fields{display:block}

  label.f{display:block;margin-top:12px}
  label.f span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#7a7a82;margin-bottom:6px}
  input[type=text],input[type=number],textarea,select{
    width:100%;background:#0d0d0f;border:1px solid var(--line);border-radius:8px;
    color:var(--ink);padding:9px 11px;font-size:13px;font-family:var(--sans);
  }
  textarea{resize:vertical;min-height:56px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:#4a4a54}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:#b9b9c0;font-size:13px;cursor:pointer}
  .chk input{accent-color:var(--brand)}

  .ed-foot{
    position:absolute;bottom:0;left:0;right:0;padding:16px 24px;
    background:linear-gradient(transparent,var(--panel) 30%);
    display:flex;flex-wrap:wrap;gap:8px;
  }
  .btn{
    background:var(--panel-2);border:1px solid var(--line);color:#d8d8de;
    border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;font-family:var(--sans);
  }
  .btn:hover{border-color:#4a4a54}
  .btn.accent{background:var(--brand);border-color:var(--brand);color:#111;font-weight:600}
  .btn.sm{padding:6px 10px;font-size:12px}

  #addmenu{position:relative}
  #addlist{
    position:absolute;bottom:44px;left:0;background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none;min-width:190px;
  }
  #addlist.open{display:block}
  #addlist button{
    display:block;width:100%;text-align:left;background:none;border:0;color:#d8d8de;
    padding:10px 14px;font-size:13px;cursor:pointer;font-family:var(--sans);
  }
  #addlist button:hover{background:#222227}

  #io{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
  #io.open{display:flex}
  #io .box{width:640px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
  #io textarea{min-height:260px;font-family:var(--mono);font-size:12px}
  #io .actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}

  @media (prefers-reduced-motion:reduce){
    /* entrance choreography collapses to an instant jump to the settled state
       (opacity cross-fades that aid comprehension are kept where they exist) */
    .reveal,.reveal.fx-stagger .w,.reveal.fx-clip .cl,.slide,.rv-photo,.rv-photo img,.rv-photo::after,
    .pl-row.pl-anim .pl-pill,.pl-row.pl-anim .pl-line,.pl-row.pl-anim .pl-line span,
    .mk-card,.mk-overlay,.cd-window.reveal,.cd-chrome i,
    .up-base,.up-progress,.up-progress .trk i,.up-hand,.up-drag,.up-cursor,
    .up-phase1,.up-phase2,.up-nodes,
    .ch2-node,.ch2-lines,.st-sub,.in-btn,.in-cursor,.cd-run,.cd-cursor,
    .pl-shine .pl-pill{
      transition:none!important;
    }
    /* stop looping / ambient motion and pin elements to their final state */
    .slide.active .hb-node{animation:none!important}
    .hb-node{opacity:1!important;transform:none!important}
    .hb-node.float .hb-inner,.hb-globe.spin,.hb-dot.pulse,.hb-cursor{animation:none!important}
    .pl-shine .pl-pill::after{animation:none!important;opacity:0!important}
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">
    <div id="slides"></div>
    <div id="gridOverlay"><div class="gi"></div></div>
    <div class="watermark" id="watermark"></div>
    <div id="progress"><i id="progressBar"></i></div>
  </div>
</div>

<button id="gear" title="Edit slides (E)">⚙</button>
<div id="hint">E edit · Space pause · ←/→ nav · F fullscreen · G grid</div>

<aside id="editor">
  <div class="ed-head">
    <h2>Slide editor</h2>
    <button class="x" id="edClose">✕</button>
  </div>
  <div class="ed-body">
    <div class="ed-global">
      <h3>Deck settings</h3>
      <div class="row2">
        <label class="f"><span>Default duration (s)</span>
          <input type="number" id="gDur" min="2" step="1"></label>
        <label class="f"><span>Fade (ms)</span>
          <input type="number" id="gFade" min="0" step="100"></label>
      </div>
      <label class="chk"><input type="checkbox" id="gLogo"> Show Uploadcare glyph (bottom-right, every slide)</label>
    </div>
    <div id="cards"></div>
  </div>
  <div class="ed-foot">
    <div id="addmenu">
      <button class="btn accent" id="addBtn">+ Add slide</button>
      <div id="addlist">
        <button data-type="statement">Statement</button>
        <button data-type="number">Big number</button>
        <button data-type="chart">Animated chart</button>
        <button data-type="stats">Stats trio</button>
        <button data-type="logo">Logo / brand</button>
        <button data-type="logoAnim">Logo animation</button>
        <button data-type="board">File board (hero)</button>
        <button data-type="reveal">Reveal (mosaic → photo)</button>
        <button data-type="mockup">UI mockup</button>
        <button data-type="code">Code / terminal</button>
        <button data-type="upload">Upload demo</button>
        <button data-type="chaos">Chaos graph</button>
        <button data-type="install">Install app</button>
      </div>
    </div>
    <button class="btn" id="ioBtn">Export / Import</button>
    <button class="btn" id="fsBtn">Fullscreen</button>
  </div>
</aside>

<div id="io">
  <div class="box">
    <h3 style="font-size:14px;margin-bottom:10px">Deck configuration (JSON)</h3>
    <p style="font-size:12px;color:#8a8a92;margin-bottom:12px">Copy this to save your deck, or paste a saved config and press Apply. You can also download it as a file.</p>
    <textarea id="ioText" spellcheck="false"></textarea>
    <div class="actions">
      <button class="btn" id="ioDownload">Download .json</button>
      <button class="btn" id="ioClose">Close</button>
      <button class="btn accent" id="ioApply">Apply</button>
    </div>
  </div>
</div>

<script id="logo-src" type="text/plain">__LOGO_SVG__</script>
<script id="glyph-src" type="text/plain">__GLYPH_SVG__</script>
<script id="assets-src" type="application/json">__ASSETS_JSON__</script>
<script id="globe-src" type="text/plain">__GLOBE_SVG__</script>
<script id="uploader-src" type="application/json">__UPLOADER_JSON__</script>
<script id="pixel-src" type="application/json">__PIXEL_JSON__</script>

<script>
/* =========================================================
   Uploadcare TV show — auto-playing 16:9 deck
   Types: statement | number | chart | stats | logo
========================================================= */
const LOGO = document.getElementById('logo-src').textContent;
const GLYPH = document.getElementById('glyph-src').textContent;
const ASSETS = JSON.parse(document.getElementById('assets-src').textContent);
const GLOBE = document.getElementById('globe-src').textContent;
const UPLOADER = JSON.parse(document.getElementById('uploader-src').textContent);
const PIXEL = JSON.parse(document.getElementById('pixel-src').textContent);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- motion system ----------------
   JS twin of the CSS motion tokens, so the cursor demos speak the same
   language. springKeyframes() numerically integrates a damped spring and
   returns sampled positions; response = time-to-target feel (seconds),
   bounce = overshoot (0 = critically damped, Apple's default; ~0.15 = a
   momentum landing). This is what makes the fake pointer settle like a real
   physical object instead of sliding a fixed distance in a fixed time. */
const EASE = { out:'cubic-bezier(.16,1,.3,1)', inOut:'cubic-bezier(.4,0,.2,1)', pop:'cubic-bezier(.34,1.45,.64,1)' };
function springKeyframes(from, to, {response=0.4, bounce=0, velocity={}}={}){
  const mass = 1;
  const stiffness = Math.pow((2*Math.PI)/response, 2) * mass;
  const zeta = bounce>=0 ? 1-bounce : 1/(1+bounce);      // damping ratio
  const damping = zeta * 2 * Math.sqrt(stiffness*mass);
  const dt = 1/120, maxT = Math.max(response*4, 1.5);
  const props = Object.keys(to);
  const st = props.map(p=>({x:(from[p]||0), v:(velocity[p]||0), t:to[p]}));
  const frames = [];
  for (let t=0; t<=maxT; t+=dt){
    let settled = true;
    for (const s of st){
      const f = stiffness*(s.t - s.x) - damping*s.v;      // Hooke + viscous damping
      s.v += f*dt; s.x += s.v*dt;
      if (Math.abs(s.t-s.x) > 0.35 || Math.abs(s.v) > 0.35) settled = false;
    }
    frames.push(st.map(s=>s.x));
    if (t > response*0.5 && settled) break;
  }
  frames.push(st.map(s=>s.t));                             // snap exactly home
  return { frames, props, duration: frames.length*dt*1000 };
}
/* spring a translated element from {x,y} to {x,y} via WAAPI (easing:'linear',
   the spring is baked into the sampled frames). Extra WAAPI options (delay,
   fill) pass through. */
function springTo(el, from, to, opts={}){
  const { frames, props, duration } = springKeyframes(from, to, opts);
  const kf = frames.map(vals=>{
    const o = {}; props.forEach((p,i)=>o[p]=vals[i]);
    return { transform:`translate(${o.x||0}px,${o.y||0}px)` };
  });
  return el.animate(kf, { duration, delay:opts.delay||0, easing:'linear', fill:opts.fill||'both' });
}

function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function multiline(s){ return esc(s).replace(/\n/g,'<br>'); }
/* single-field headline, with a fallback that merges the old dimmed line1 +
   bright line2 into one flowing string so existing decks keep working. */
function headText(s){ return s.heading!=null ? s.heading : [s.line1,s.line2].filter(v=>v).join(' '); }
function headText2(s){ return s.heading2!=null ? s.heading2 : [s.line1b,s.line2b].filter(v=>v).join(' '); }

/* ---------------- shared "text animation" system ----------------
   One control (see fieldsFor) drives how every .reveal element on a slide
   enters: rise (default, already the base .reveal look) | blur (soft-focus
   settle) | weight (Inter Variable weight-morph — needs the embedded
   variable font) | stagger (word-by-word cascade). Runs once per slide at
   render time so it composes for free with the existing .reveal/d1-d4
   delay system. ------------------------------------------------------- */
function wrapWords(el){
  let wi = 0;
  el.innerHTML = el.innerHTML.split('<br>').map(line=>
    line.split(/(\s+)/).map(tok=>{
      if (!tok.trim()) return tok;
      const span = `<span class="w" style="--wi:${wi}">${tok}</span>`;
      wi++;
      return span;
    }).join('')
  ).join('<br>');
}
function wrapInner(el){ el.innerHTML = `<span class="cl">${el.innerHTML}</span>`; }
function applyTextFx(slideEl, fx){
  slideEl.querySelectorAll('.reveal').forEach(el=>{
    el.classList.remove('fx-blur','fx-weight','fx-stagger','fx-clip');
    el.style.removeProperty('--fw-target');
    if (!fx || fx==='rise') return;
    const textOnly = [...el.childNodes].every(n=>n.nodeType===3 || (n.nodeType===1 && n.tagName==='BR'));
    if (fx==='stagger'){
      if (textOnly && el.textContent.trim()){ wrapWords(el); el.classList.add('fx-stagger'); }
      return;
    }
    if (fx==='clip'){
      if (textOnly && el.textContent.trim()){ wrapInner(el); el.classList.add('fx-clip'); }
      return;
    }
    if (fx==='weight') el.style.setProperty('--fw-target', getComputedStyle(el).fontWeight);
    el.classList.add('fx-'+fx);
  });
}

/* ---------------- auto-fit oversized headlines ---------------- */
function fitText(slideEl){
  const MAXW = 1740; // usable width inside the 1920 stage
  slideEl.querySelectorAll('.num-big,.st-line1,.st-line2,.ch-big').forEach(el=>{
    el.style.fontSize=''; // reset to stylesheet value
    let size = parseFloat(getComputedStyle(el).fontSize), guard = 0;
    while (el.scrollWidth > MAXW && size > 40 && guard < 40){
      size *= Math.max(.7, MAXW/el.scrollWidth * .98);
      el.style.fontSize = size+'px';
      guard++;
    }
  });
}

/* ---------------- per-slide animations ---------------- */
function animateCount(el){
  const target = +el.dataset.value, dec = +el.dataset.decimals;
  if (REDUCED){ el.textContent = target.toFixed(dec); return; }
  const dur = 1300, t0 = performance.now();
  function tick(t){
    const p = Math.min(1,(t-t0)/dur);
    const e = 1 - Math.pow(1-p, 4); // expo-out: fast start, smooth settle
    el.textContent = (target*e).toFixed(dec);
    if (p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function buildChart(svg){
  const pts = svg.dataset.points.split(',').map(v=>parseFloat(v)).filter(v=>!isNaN(v));
  if (pts.length<2) return;
  const x0=340, x1=1780, yTop=330, yBot=880;
  const min=Math.min(...pts), max=Math.max(...pts);
  const X=i=>x0+(x1-x0)*i/(pts.length-1);
  const Y=v=>yBot-(yBot-yTop)*((v-min)/((max-min)||1));
  const d = pts.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const sx=X(0), sy=Y(pts[0]), ex=X(pts.length-1), ey=Y(pts[pts.length-1]);
  svg.innerHTML = `
    <path class="ch-line" d="${d}"/>
    <rect class="ch-dot dot-s" x="${sx-9}" y="${sy-9}" width="18" height="18"/>
    <rect class="ch-dot dot-e" x="${ex-9}" y="${ey-9}" width="18" height="18"/>
    <text class="ch-val val-s" x="${sx-8}" y="${sy-42}">${svg.dataset.start}</text>
    <text class="ch-val val-e" x="${ex-120}" y="${ey-52}" text-anchor="start">${svg.dataset.end}</text>`;
  const path = svg.querySelector('.ch-line');
  const len = path.getTotalLength();
  const dotS=svg.querySelector('.dot-s'), dotE=svg.querySelector('.dot-e');
  const valS=svg.querySelector('.val-s'), valE=svg.querySelector('.val-e');
  if (REDUCED){
    [dotS,dotE,valS,valE].forEach(n=>n.style.opacity=1);
    return;
  }
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  // start marker + label appear first
  setTimeout(()=>{ dotS.style.transition=valS.style.transition='opacity .4s'; dotS.style.opacity=valS.style.opacity=1; }, 200);
  // draw the line
  setTimeout(()=>{
    path.style.transition = `stroke-dashoffset 1900ms cubic-bezier(.16,1,.3,1)`;
    path.style.strokeDashoffset = 0;
  }, 450);
  // end marker + label
  setTimeout(()=>{ dotE.style.transition=valE.style.transition='opacity .4s'; dotE.style.opacity=valE.style.opacity=1; }, 2350);
}

/* ---------------- logo animation engine ----------------
   Whole lockup:  assemble | rise | sweep
   Mark only:     mark-ring | mark-scatter | mark-breathe
--------------------------------------------------------- */
function animateLogo(container){
  const box = container.querySelector('.la-logo');
  if (!box) return;
  const svg = box.querySelector('svg');
  const variant = box.dataset.variant || 'assemble';
  const isMark = variant.startsWith('mark');

  // reset any running animations from a previous pass
  svg.getAnimations({subtree:true}).forEach(a=>a.cancel());
  svg.getAnimations().forEach(a=>a.cancel());

  const pixels  = [...svg.querySelectorAll('path[fill="#FFCF3E"]')];
  const letters = [...svg.querySelectorAll('path[fill="white"]')];
  letters.forEach(l=>l.style.display = isMark ? 'none' : '');
  svg.setAttribute('viewBox', isMark ? '0 0 147 147' : '0 0 803 147');
  svg.style.filter=''; svg.style.opacity='';
  pixels.concat(letters).forEach(n=>{ n.style.opacity=''; n.style.transform=''; });

  const tag = container.querySelector('.la-tag');
  if (tag) tag.getAnimations().forEach(a=>a.cancel());

  const bb = el=>{ try{ return el.getBBox(); }catch(e){ return {x:0,y:0,width:0,height:0}; } };
  const C = {x:73.5, y:73.5};
  const px = pixels.map(p=>{
    const b=bb(p), cx=b.x+b.width/2, cy=b.y+b.height/2;
    return {p, cx, cy,
      dist: Math.hypot(cx-C.x, cy-C.y),
      ang: (Math.atan2(cy-C.y, cx-C.x) + Math.PI*2.5) % (Math.PI*2)}; // 0 = top, clockwise
  });
  const maxDist = Math.max(...px.map(o=>o.dist), 1);
  const lx = letters.map(l=>({l, x: bb(l).x}));

  const showTag = (delay)=>{
    if (!tag) return;
    if (REDUCED){ tag.style.opacity=1; return; }
    tag.animate([{opacity:0, transform:'translateY(12px)'},{opacity:1, transform:'none'}],
      {duration:560, delay, easing:'cubic-bezier(.16,1,.3,1)', fill:'both'});
  };

  if (REDUCED){
    pixels.concat(letters).forEach(n=>n.style.opacity=1);
    if (tag) tag.style.opacity=1;
    return;
  }

  const EASE_OUT = 'cubic-bezier(.22,.61,.36,1)';
  const EASE_POP = 'cubic-bezier(.34,1.45,.64,1)';

  switch(variant){

    /* 1 — pixels of the ring assemble outward from the center,
           then the wordmark letters cascade in */
    case 'assemble': {
      px.sort((a,b)=>a.dist-b.dist).forEach((o,i)=>{
        o.p.animate(
          [{opacity:0, transform:'scale(.2)'},{opacity:1, transform:'scale(1)'}],
          {duration:520, delay:120+i*16, easing:EASE_POP, fill:'both'});
      });
      lx.sort((a,b)=>a.x-b.x).forEach((o,i)=>{
        o.l.animate(
          [{opacity:0, transform:'translateY(12px)'},{opacity:1, transform:'none'}],
          {duration:600, delay:820+i*26, easing:EASE_OUT, fill:'both'});
      });
      showTag(1500);
      break;
    }

    /* 2 — cinematic rise: the whole lockup surfaces out of soft focus */
    case 'rise': {
      svg.animate(
        [{opacity:0, filter:'blur(16px)', transform:'translateY(46px) scale(.985)'},
         {opacity:1, filter:'blur(0px)',  transform:'none'}],
        {duration:1600, delay:150, easing:EASE_OUT, fill:'both'});
      // gentle secondary settle on the mark
      pixels.forEach(p=>p.animate(
        [{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],
        {duration:1200, delay:1750, easing:'ease-in-out'}));
      showTag(1400);
      break;
    }

    /* 3 — light sweep: everything reveals left→right, then a soft
           highlight travels across once */
    case 'sweep': {
      const all = px.map(o=>({el:o.p, x:o.cx})).concat(lx.map(o=>({el:o.l, x:o.x})));
      all.forEach(o=>{
        const d = 150 + (o.x/803)*900;
        o.el.animate(
          [{opacity:0, transform:'translateX(-8px)'},{opacity:1, transform:'none'}],
          {duration:450, delay:d, easing:EASE_OUT, fill:'both'});
        o.el.animate(
          [{filter:'brightness(1)'},{filter:'brightness(1.9)'},{filter:'brightness(1)'}],
          {duration:520, delay:1650 + (o.x/803)*700, easing:'ease-in-out'});
      });
      showTag(1500);
      break;
    }

    /* 4 — mark only: the ring builds clockwise from 12 o'clock,
           then a soft glow keeps orbiting */
    case 'mark-ring': {
      const ordered = px.slice().sort((a,b)=>a.ang-b.ang);
      ordered.forEach((o,i)=>{
        o.p.animate(
          [{opacity:0, transform:'scale(.35)'},{opacity:1, transform:'scale(1)'}],
          {duration:420, delay:200+i*26, easing:EASE_POP, fill:'both'});
        // perpetual orbiting glow, phase-shifted by angle
        o.p.animate(
          [{opacity:1},{opacity:.45},{opacity:1}],
          {duration:3200, delay:200+ordered.length*26+500 + (o.ang/(Math.PI*2))*3200,
           iterations:Infinity, easing:'ease-in-out'});
      });
      showTag(1700);
      break;
    }

    /* 5 — mark only: pixels drift in from scattered positions and settle */
    case 'mark-scatter': {
      px.forEach(o=>{
        const dx=(Math.random()-.5)*220, dy=(Math.random()-.5)*220, r=(Math.random()-.5)*140;
        o.p.animate(
          [{opacity:0, transform:`translate(${dx}px,${dy}px) rotate(${r}deg) scale(.5)`},
           {opacity:1, transform:'none'}],
          {duration:1100, delay:100+Math.random()*450, easing:EASE_OUT, fill:'both'});
        // occasional twinkle after settling
        o.p.animate(
          [{opacity:1},{opacity:.6},{opacity:1}],
          {duration:2200+Math.random()*2600, delay:2200+Math.random()*2000,
           iterations:Infinity, easing:'ease-in-out'});
      });
      showTag(1500);
      break;
    }

    /* 6 — mark only: a calm breathing wave radiates from the center, forever */
    case 'mark-breathe': {
      px.forEach(o=>{
        o.p.animate([{opacity:0},{opacity:1}],
          {duration:700, delay:100+(o.dist/maxDist)*400, easing:EASE_OUT, fill:'both'});
        o.p.animate(
          [{transform:'scale(1)', opacity:.82},
           {transform:'scale(1.14)', opacity:1},
           {transform:'scale(1)', opacity:.82}],
          {duration:2800, delay:900+(o.dist/maxDist)*1100,
           iterations:Infinity, easing:'ease-in-out'});
      });
      showTag(1100);
      break;
    }
  }
}

/* ---------------- file-board: terminal typewriter ----------------
   Each meta block is a list of lines; each line is a list of
   [text, className] segments. Empty line = spacer. The text types
   in character by character with a live cursor. --------------------- */
const BOARD_META = {
  tennis: { lines:[
    [['IMAGE REQUESTED','']],
    [['SIZE: ',''],['1024X768','b']],
    [['DELIVERED IN: ',''],['67 MS','g']],
  ], keepCursor:false, startAt:600 },
  blonde: { lines:[
    [['IMAGE REQUESTED','']],
    [['SIZE: ',''],['1024X768','b']],
    [['DELIVERED IN: ',''],['67 MS','g']],
  ], keepCursor:false, startAt:900 },
  sneaker: { lines:[
    [['FILE RECEIVED.','']],
    [['USER ',''],['J18N88910M','b']],
    [['JPEG · 1 MB','']],
    [['','']],
    [['SCANNING... ',''],['DONE.','g']],
    [['NSFW: ',''],['NO','g']],
    [['','']],
    [['GENERATING JPEG PREVIEWS... DONE','']],
    [['READY FOR DELIVERY','']],
  ], keepCursor:false, startAt:1200 },
  docx: { lines:[
    [['UPLOADING...','']],
    [['USER ',''],['J18N88910M','b']],
    [['DOCX · 1 MB','']],
  ], keepCursor:true, startAt:1500 },
};

const boardTimers = [];
function clearBoardTimers(){ boardTimers.forEach(clearTimeout); boardTimers.length=0; }

function fillMetaInstant(metaEl, spec){
  metaEl.innerHTML='';
  spec.lines.forEach(line=>{
    const div=document.createElement('div'); div.className='hb-line';
    line.forEach(([txt,cls])=>{
      const sp=document.createElement('span'); if(cls) sp.className=cls; sp.textContent=txt; div.appendChild(sp);
    });
    if(!line.length || (line.length===1 && line[0][0]==='')) div.innerHTML='&nbsp;';
    metaEl.appendChild(div);
  });
  if (spec.keepCursor){
    const c=document.createElement('span'); c.className='hb-cursor';
    metaEl.lastChild.appendChild(c);
  }
}

function typeMeta(metaEl, spec, speed){
  metaEl.innerHTML='';
  const cursor=document.createElement('span'); cursor.className='hb-cursor';
  let li=0;
  function typeLine(){
    if(li>=spec.lines.length){
      if(!spec.keepCursor) cursor.remove();
      return;
    }
    const line=spec.lines[li];
    const div=document.createElement('div'); div.className='hb-line';
    metaEl.appendChild(div);
    // spacer line
    if(!line.length || (line.length===1 && line[0][0]==='')){
      div.innerHTML='&nbsp;'; li++;
      boardTimers.push(setTimeout(typeLine, speed*2));
      return;
    }
    // flatten this line's characters with their class
    const chars=[];
    line.forEach(([txt,cls])=>{ for(const ch of txt) chars.push([ch,cls]); });
    let ci=0, span=null, curCls=null;
    div.appendChild(cursor);
    function typeChar(){
      if(ci>=chars.length){ li++; boardTimers.push(setTimeout(typeLine, speed*3)); return; }
      const [ch,cls]=chars[ci++];
      if(span===null || cls!==curCls){
        span=document.createElement('span'); if(cls) span.className=cls; curCls=cls;
        div.insertBefore(span, cursor);
      }
      span.textContent+=ch;
      boardTimers.push(setTimeout(typeChar, speed));
    }
    typeChar();
  }
  typeLine();
}

function setupBoard(slideEl, sd){
  clearBoardTimers();
  const globe = slideEl.querySelector('.hb-globe');
  if (globe && sd.globe!==false && !REDUCED) globe.classList.add('spin');

  const floatOn = sd.float!==false && !REDUCED;
  const dots = slideEl.querySelectorAll('.hb-dot');
  if (floatOn) dots.forEach(d=>d.classList.add('pulse'));

  const fdur = {n1:9.5, n2:8, n3:11, n4:8.8};
  slideEl.querySelectorAll('.hb-node').forEach(node=>{
    const key = node.dataset.meta;
    const spec = BOARD_META[key];
    const metaEl = node.querySelector('.hb-meta');

    if (floatOn){
      node.classList.add('float');
      const cls = [...node.classList].find(c=>/^n\d$/.test(c));
      node.style.setProperty('--fdur', (fdur[cls]||9)+'s');
      node.style.setProperty('--fdelay', (-Math.random()*6).toFixed(2)+'s');
    }

    if (!spec) return;
    if (sd.typing===false || REDUCED){
      fillMetaInstant(metaEl, spec);
    } else {
      const speed = Math.max(4, sd.typeSpeed||16);
      boardTimers.push(setTimeout(()=>typeMeta(metaEl, spec, speed), spec.startAt));
    }
  });
}

/* ---------------- code slide: generic terminal typewriter ----------------
   Simpler than the board's typeMeta (plain lines, no inline colour spans) —
   kept separate so the working board typewriter is never touched. --------- */
const codeTimers = [];
function clearCodeTimers(){ codeTimers.forEach(clearTimeout); codeTimers.length=0; }

function fillLinesInstant(el, lines){
  el.innerHTML = lines.map(t=>t
    ? `<div class="hb-line">${esc(t)}</div>`
    : `<div class="hb-line">&nbsp;</div>`).join('');
}

function typeLines(el, lines, speed){
  el.innerHTML='';
  const cursor=document.createElement('span'); cursor.className='hb-cursor';
  let li=0;
  function typeLine(){
    if (li>=lines.length){ cursor.remove(); return; }
    const div=document.createElement('div'); div.className='hb-line'; el.appendChild(div);
    const text=lines[li];
    if (!text){
      div.innerHTML='&nbsp;'; li++;
      codeTimers.push(setTimeout(typeLine, speed*2));
      return;
    }
    const span=document.createElement('span');
    div.appendChild(span); div.appendChild(cursor);
    let ci=0;
    function typeChar(){
      if (ci>=text.length){ li++; codeTimers.push(setTimeout(typeLine, speed*3)); return; }
      span.textContent += text[ci++];
      codeTimers.push(setTimeout(typeChar, speed));
    }
    typeChar();
  }
  typeLine();
}

/* code slide: the cursor glides onto RUN, taps it, and the command's output
   streams into the terminal. Cursor = WAAPI (self-cancels); output = timers. */
function setupCode(slideEl, sd){
  clearCodeTimers();
  const win = slideEl.querySelector('.cd-window');
  const out = slideEl.querySelector('.cd-out');
  const run = slideEl.querySelector('.cd-run');
  const cursor = slideEl.querySelector('.cd-cursor');
  if (!out || !run) return;
  const lines = (sd.lines || '').split('\n');

  out.innerHTML = ''; run.classList.remove('press');
  win && win.querySelectorAll('*').forEach(el=>el.getAnimations&&el.getAnimations().forEach(a=>a.cancel()));

  const paint = ()=>{ out.innerHTML = lines.map(t=>`<div>${t?esc(t):'&nbsp;'}</div>`).join('')
      .replace('\u2713','<span class="g">\u2713</span>'); };

  if (REDUCED){ if(cursor) cursor.style.opacity=0; paint(); return; }
  if (!cursor){ paint(); return; }

  // RUN button sits ~ lower-left of the window; cursor starts mid-window.
  // The travel is a spring so the pointer decelerates onto the button.
  const START={x:430,y:150}, OVER={x:70,y:392};
  cursor.style.opacity=0; cursor.style.transform=`translate(${START.x}px,${START.y}px)`;
  cursor.animate([{opacity:0},{opacity:1}],{duration:300,delay:700,fill:'both'});
  const travel = springTo(cursor, START, OVER, {response:0.6, bounce:0.10, delay:800});
  const arrive = 800 + travel.effect.getTiming().duration;
  // tap dip, anchored at the button (composes over the spring's settled value)
  cursor.animate([
    {transform:`translate(${OVER.x}px,${OVER.y}px)`},
    {transform:`translate(${OVER.x}px,${OVER.y+5}px)`},
    {transform:`translate(${OVER.x}px,${OVER.y}px)`}],
    {duration:240, delay:arrive, easing:EASE.inOut});
  const clickAt = arrive + 90;
  codeTimers.push(setTimeout(()=>run.classList.add('press'), clickAt));
  codeTimers.push(setTimeout(()=>run.classList.remove('press'), clickAt+220));
  // after the tap, stream the output
  codeTimers.push(setTimeout(()=>typeLines(out, lines, Math.max(4, sd.typeSpeed||18)), clickAt+320));
}

/* ---------------- upload demo: cursor drags a photo into the dropzone,
   the uploader goes static → hover → uploading, then a progress bar fills.
   All motion is Web Animations API (no timers) so leaving the slide and
   coming back just re-runs cleanly. Coordinates are authored against the
   fixed 600×520 .up-stage box. --------------------------------------- */
function setupUpload(slideEl, sd){
  const wrap = slideEl.querySelector('.up-wrap');
  const stage = slideEl.querySelector('.up-stage');
  if (!wrap || !stage) return;
  const stat = stage.querySelector('.up-static');
  const hover = stage.querySelector('.up-hover');
  const uploading = stage.querySelector('.up-uploading');
  const prog = stage.querySelector('.up-progress');
  const fill = stage.querySelector('.up-progress .trk i');
  const hand = stage.querySelector('.up-hand');
  const drag = stage.querySelector('.up-drag');
  const cursor = stage.querySelector('.up-cursor');
  const phase1 = wrap.querySelector('.up-phase1');
  const phase2 = wrap.querySelector('.up-phase2');
  const nodes = wrap.querySelector('.up-nodes');

  // cancel anything still running from a previous visit
  wrap.querySelectorAll('*').forEach(el=>el.getAnimations().forEach(a=>a.cancel()));

  const START = {x:430,y:380};
  const END   = {x:252,y:97};

  // reset to frame 0
  hover.style.opacity = 0; uploading.style.opacity = 0; prog.style.opacity = 0;
  fill.style.width = '0%'; drag.style.opacity = 1; cursor.style.opacity = 1;
  hand.style.transform = `translate(${START.x}px,${START.y}px)`;
  phase1.style.opacity = 1; phase2.style.opacity = 0; nodes.style.opacity = 0;

  const withOutcome = sd.outcome !== false;         // slide 3 ends clean at "uploaded"

  if (REDUCED){
    // jump straight to the end state
    stat.style.opacity = 0; uploading.style.opacity = 1;
    prog.style.opacity = 1; fill.style.width = '100%';
    hand.style.display = 'none';
    if (withOutcome){ phase1.style.opacity = 0; phase2.style.opacity = 1; nodes.style.opacity = 1; }
    return;
  }
  hand.style.display = '';

  const B = 700;                                   // let the box fade in first
  const progMs = Math.max(800, sd.progressMs||3000);

  // 1 — cursor + photo travel into the dropzone. A spring (slight bounce)
  //     decelerates the "drag" and lands it physically, instead of a fixed
  //     1300ms slide — the pointer now carries momentum into the zone.
  const travel = springTo(hand, START, END, {response:0.62, bounce:0.12, delay:B});
  const ARRIVE = B + travel.effect.getTiming().duration; // when the hand settles
  // 2 — dropzone lights up (hover state) as the cursor arrives over it
  hover.animate([{opacity:0},{opacity:1}],
    {duration:400, delay:ARRIVE-260, fill:'both'});
  // 3 — a little click dip at the moment of drop
  cursor.animate([{transform:'translate(0,0)'},{transform:'translate(0,5px)'},{transform:'translate(0,0)'}],
    {duration:240, delay:ARRIVE, easing:EASE.inOut});
  // 4 — the photo shrinks into the dropzone and fades
  drag.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.32) translateY(10px)',opacity:0}],
    {duration:520, delay:ARRIVE+50, easing:'cubic-bezier(.5,0,.5,1)', fill:'both'});
  // 5 — cursor slides away and fades out
  cursor.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate(150px,-120px)',opacity:0}],
    {duration:700, delay:ARRIVE+300, easing:EASE.inOut, fill:'both'});
  // 6 — dropzone switches to the uploading state (covers hover on top)
  uploading.animate([{opacity:0},{opacity:1}],
    {duration:400, delay:ARRIVE+350, fill:'both'});
  // 7 — progress bar appears and slowly fills
  prog.animate([{opacity:0},{opacity:1}],
    {duration:300, delay:ARRIVE+400, fill:'both'});
  fill.animate([{width:'0%'},{width:'100%'}],
    {duration:progMs, delay:ARRIVE+450, easing:'cubic-bezier(.25,.1,.25,1)', fill:'both'});

  // ---- the payoff (only when this slide owns the outcome) -------------------
  if (!withOutcome) return;                         // slide 3 rests on "uploaded"
  const PE = ARRIVE + 450 + progMs;               // moment the fill hits 100%
  // 8 — headline + uploader fade out; "side project" line + tag fade in
  phase1.animate([{opacity:1},{opacity:0}],
    {duration:600, delay:PE+150, easing:'ease', fill:'both'});
  phase2.animate([{opacity:0},{opacity:1}],
    {duration:700, delay:PE+350, easing:EASE, fill:'both'});
  // 9 — 2s later the maintenance-nodes network blooms in all around
  nodes.animate([{opacity:0, transform:'scale(.86)'},{opacity:1, transform:'scale(1)'}],
    {duration:1700, delay:PE+350+2000, easing:'cubic-bezier(.22,.61,.36,1)', fill:'both'});
}

/* pixel-mosaic canvas for the logo slide (like the keynote pixel field) */
const mosaics = new Map();
function startMosaic(canvas){
  stopMosaic(canvas);
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.offsetWidth * 1, H = canvas.height = canvas.offsetHeight * 1;
  const cell=26, gap=8, step=cell+gap;
  const cols=Math.floor(W/step), rows=Math.floor(H/step);
  const cx=cols*0.45, cy=rows*0.5;
  const cells=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const dx=(c-cx)/cols*2, dy=(r-cy)/rows*2;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if (Math.random() > 1.05-dist*0.55) continue;   // sparser at edges
    cells.push({c,r,phase:Math.random()*Math.PI*2,speed:.3+Math.random()*.7,
                base:.04+Math.random()*.5*(1-dist*.6),
                yellow:Math.random()<0.012});
  }
  let raf;
  function frame(t){
    ctx.clearRect(0,0,W,H);
    const time=t/1000;
    for(const p of cells){
      const tw = REDUCED ? 1 : (0.6+0.4*Math.sin(time*p.speed+p.phase));
      const a = Math.max(0, p.base*tw);
      ctx.fillStyle = p.yellow ? `rgba(255,207,62,${Math.min(.9,a+.25)})` : `rgba(235,235,240,${a})`;
      ctx.fillRect(p.c*step, p.r*step, cell, cell);
    }
    if (!REDUCED) raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  mosaics.set(canvas, ()=>cancelAnimationFrame(raf));
}
function stopMosaic(canvas){
  const stop = mosaics.get(canvas);
  if (stop){ stop(); mosaics.delete(canvas); }
}

/* whether a reveal slide should dissolve its dots into the real photo.
   `reveal` is the modern flag; fall back to the legacy `photo` field so old
   decks keep working. */
function revealsPhoto(s){ return s.reveal!==undefined ? !!s.reveal : !!s.photo; }

/* pixel-halftone reveal (reveal slides) — the modern take on the mosaic.
   Paints PIXEL.dots on a single canvas: the dots materialise (staggered fade +
   scale), twinkle, and — when the slide reveals a photo — dissolve out while the
   real image (sitting underneath) crossfades in, so the pixels resolve into it. */
function startPixelReveal(canvas, photoEl){
  stopMosaic(canvas);
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W || !H) return;
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const scale = Math.max(W/PIXEL.w, H/PIXEL.h);          // object-fit: cover
  const ox = (W - PIXEL.w*scale)/2, oy = (H - PIXEL.h*scale)/2;
  const dots = PIXEL.dots.map(d=>({
    x: ox + d[0]*scale,
    y: oy + d[1]*scale,
    s: Math.max(1.2, d[2]*scale),
    g: d[3],
    md: Math.random()*620,                                // materialise stagger
    dd: Math.random()*560,                                // dissolve stagger
    tw: 0.5 + Math.random()*0.8,                          // twinkle speed
    ph: Math.random()*Math.PI*2,
  }));

  const reveal = !!photoEl;
  const MAT = 520;                                         // per-dot fade-in span
  const HOLD = 950;                                        // linger before reveal
  const DISS = 620;                                        // per-dot fade-out span
  const revealAt = MAT + 620 + HOLD;                       // when dissolve starts
  const clamp = (v,a,b)=>v<a?a:v>b?b:v;
  const paint = d=>{ const s=d._s; ctx.fillRect(d.x-s/2, d.y-s/2, s, s); };

  if (REDUCED){
    if (reveal){ photoEl.classList.add('shown'); return; }
    ctx.clearRect(0,0,W,H);
    for(const d of dots){ ctx.fillStyle=`rgb(${d.g},${d.g},${d.g})`; d._s=d.s; paint(d); }
    return;
  }

  const start = performance.now();
  let raf, photoTriggered=false;
  function frame(now){
    const t = now - start;
    ctx.clearRect(0,0,W,H);
    let anyVisible = false;
    for(const d of dots){
      const appear = clamp((t - d.md)/MAT, 0, 1);
      if (appear<=0) { anyVisible = true; continue; }
      let alpha = appear;
      const twinkle = 0.78 + 0.22*Math.sin(t/1000*d.tw + d.ph);
      alpha *= twinkle;
      if (reveal && t > revealAt){
        alpha *= 1 - clamp((t - revealAt - d.dd)/DISS, 0, 1);
      }
      d._s = d.s * (0.35 + 0.65*appear);
      if (alpha>0.01){
        anyVisible = true;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = `rgb(${d.g},${d.g},${d.g})`;
        paint(d);
      }
    }
    ctx.globalAlpha = 1;

    if (reveal && !photoTriggered && t > revealAt){
      photoTriggered = true;
      photoEl.classList.add('shown');
    }
    // stop once the dissolve has fully cleared; keep looping (twinkle) otherwise
    if (reveal && photoTriggered && !anyVisible){
      ctx.clearRect(0,0,W,H);
      mosaics.delete(canvas);
      return;
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  mosaics.set(canvas, ()=>cancelAnimationFrame(raf));
}

/* ---------------- playback ---------------- */
let idx = 0, playing = true, timer = null, tickTimer = null, slideStart = 0, elapsedBeforePause = 0;
const progressBar = document.getElementById('progressBar');

function slideDuration(i){
  return ((deck.slides[i]&&deck.slides[i].duration) || deck.settings.duration || 8)*1000;
}

function enter(i){
  const nodes = slidesEl.children;
  if (!nodes.length) return;
  idx = ((i % nodes.length)+nodes.length) % nodes.length;
  [...nodes].forEach((n,k)=>{
    const on = k===idx;
    n.classList.toggle('active', on);
    if (!on) n.querySelectorAll('canvas').forEach(stopMosaic);
  });
  clearBoardTimers();
  clearCodeTimers();
  clearInstallTimers();
  const cur = nodes[idx];
  const sd = deck.slides[idx];

  // brand glyph sits on every slide (consistent signature, bottom-right grid corner)
  watermarkEl.classList.toggle('show', !!deck.settings.watermark);

  // fit oversized headlines (measure counters at their final value)
  cur.querySelectorAll('.count').forEach(el=>{
    el.textContent = (+el.dataset.value).toFixed(+el.dataset.decimals);
  });
  fitText(cur);
  cur.querySelectorAll('.count').forEach(el=>{ el.textContent = (0).toFixed(+el.dataset.decimals); });

  // (re)run animations
  cur.querySelectorAll('.count').forEach(el=>setTimeout(()=>animateCount(el), 350));
  cur.querySelectorAll('.ch-svg').forEach(buildChart);
  cur.querySelectorAll('canvas.lg-canvas').forEach(startMosaic);
  cur.querySelectorAll('canvas.rv-canvas').forEach(c=>startPixelReveal(c, cur.querySelector('.rv-photo')));
  if (sd.type==='logoAnim') animateLogo(cur);
  if (sd.type==='board') setupBoard(cur, sd);
  if (sd.type==='code') setupCode(cur, sd);
  if (sd.type==='upload') setupUpload(cur, sd);
  if (sd.type==='install') setupInstall(cur, sd);

  // timing
  clearTimeout(timer); clearInterval(tickTimer);
  elapsedBeforePause = 0; slideStart = performance.now();
  if (playing) arm();
  syncCards();
}
function arm(){
  const remain = slideDuration(idx) - elapsedBeforePause;
  timer = setTimeout(()=>enter(idx+1), remain);
  tickTimer = setInterval(()=>{
    const p = (elapsedBeforePause + (performance.now()-slideStart)) / slideDuration(idx);
    progressBar.style.width = Math.min(100, p*100)+'%';
  }, 60);
}
function pause(){
  playing=false; clearTimeout(timer); clearInterval(tickTimer);
  elapsedBeforePause += performance.now()-slideStart;
}
function resume(){ playing=true; slideStart=performance.now(); arm(); }
function togglePlay(){ playing ? pause() : resume(); }
